services:
  spotilove-database:
    image: postgres:16-alpine
    container_name: spotilove-database
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: lX2La4DQSQ23YrbKFWP4VgwoXhiajCBDZYy05ihZedI4mNfFRVIDmWqOHFlZEvVc
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  spotilove-api:
    build: .
    container_name: spotilove-api
    env_file:
      - .env
    environment:
      ConnectionStrings__PostgresConnection: "Host=spotilove-database;Port=5432;Database=postgres;Username=postgres;Password=lX2La4DQSQ23YrbKFWP4VgwoXhiajCBDZYy05ihZedI4mNfFRVIDmWqOHFlZEvVc;SslMode=Disable;Trust Server Certificate=true"
    ports:
      - "3000:3000"
      - "10000:10000"
    depends_on:
      spotilove-database:
        condition: service_healthy

volumes:
  postgres_data:
